<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Valentine?</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 100px;
            background-color: #f7dcd6;
        }
        h1 {
            color: #d11a2a;
        }
        .container {
            margin-top: 50px;
        }
        button {
            padding: 15px 30px;
            font-size: 18px;
            margin: 10px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
        }
        #yesBtn {
            background-color: #4CAF50;
            color: white;
        }
        #noBtn {
            background-color: #f44336;
            color: white;
            position: absolute;
        }
    </style>
</head>
<body>
    <h1>क्या आप मुझसे शादी करेंगी?</h1>
    <div class="container">
        <button id="yesBtn" onclick="alert('I love you too!')">हाँ</button>
        <button id="noBtn" onmouseover="moveButton()">नहीं</button>
    </div>

    <script>
        function moveButton() {
            var btn = document.getElementById("noBtn");
            var x = Math.random() * (window.innerWidth - btn.offsetWidth - 20) + 10;
            var y = Math.random() * (window.innerHeight - btn.offsetHeight - 20) + 10;
            btn.style.left = x + "px";
            btn.style.top = y + "px";
        }
    </script>
</body>
</html>
