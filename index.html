<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Chuja🐣</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 100px;
            background-color: #ffb6c1; /* Pink background */
            overflow: hidden;
            position: relative;
        }
        h1 {
            color: #d11a2a;
        }
        .container {
            margin-top: 50px;
        }
        button {
            padding: 15px 30px;
            font-size: 18px;
            margin: 10px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
        }
        #yesBtn {
            background-color: #4CAF50;
            color: white;
        }
        #noBtn {
            background-color: #f44336;
            color: white;
            position: absolute;
        }
        .emoji-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
            font-size: 50px;
        }
    </style>
</head>
<body>
    <div class="emoji-bg">🦄⭐❤️✨🦄⭐❤️</div>
    <h1>My Chuja?</h1>
    <div class="container">
        <button id="yesBtn" onclick="alert('muja peak mila ge👀? ❤️❤️❤️')">Yes</button>
        <button id="noBtn" onmouseover="moveButton()">No</button>
    </div>

    <script>
        function moveButton() {
            var btn = document.getElementById("noBtn");
            var x = Math.random() * (window.innerWidth - btn.offsetWidth - 20) + 10;
            var y = Math.random() * (window.innerHeight - btn.offsetHeight - 20) + 10;
            btn.style.left = x + "px";
            btn.style.top = y + "px";
        }
    </script>
</body>
</html>
